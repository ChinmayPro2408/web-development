<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="/css/task.css">
</head>
<body>
    <section id="form">
        <form>
            <h3>Student Registration Form</h3>
        <label for="fullname">  Name</label>
        <br>
        <input type="text" name="fullname" placeholder="Enter Name" required>
         <br>
         <label for="email"> Email Id</label>
        <br>
        <input type="email" name="email" placeholder="Enter Email" required>
         <br>
        <label for="password"> Password</label>
        <br>
        <input type="password" name="password" placeholder="Enter Password" required>
        <br>  
        <label for="Gender"> Gender</label>
        <br>
        <select name="Gender" id="">
         <option>Male</option>
          <option>female</option>
        </select>
        <br>
        <label for="date"> Date of Birth</label>
        <br>
        <input type="date" name="DOB" placeholder="Enter DOB" required>
         <br>
         <label for="Course Selection ">Course Selection</label>
         <br>
        <select name="Course Selection" id="">
         <option>Full stack Builder with AI</option>
         <option>Data Analytics with AI</option>

          <option>Devlops </option>
          <option>AI Automation</option>
        </select>
        <br>
        <label for="address">Address</label>
        <br>
        <textarea name="address" rows="5" cols="20"></textarea>
        <br>
        <br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
     
        </form>
    </section>
</body>
</html>
